<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>능률VOCA 스마트 학습 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FBFBF9; /* Soft Ivory */
            color: #333333; /* Charcoal Gray */
            /* 스크롤 방지 핵심 속성 */
            overflow: hidden;
            height: 100vh;
            height: 100dvh; 
            touch-action: none; /* 제스처로 인한 화면 밀림 방지 */
        }

        /* 캔버스 터치 방지 */
        canvas {
            touch-action: none;
        }

        /* 페이드 효과 등 유틸리티 클래스 */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* 커스텀 스크롤바 (오답 리스트 등에 필요시 제한적 사용) */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
    <script>
        // Tailwind 커스텀 색상 설정
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ivory: '#FBFBF9',
                        charcoal: '#333333',
                        sage: '#6B8E23',
                        coral: '#E57373',
                        cardBg: '#FFFFFF'
                    }
                }
            }
        }
    </script>
</head>
<body class="w-full flex justify-center bg-gray-100">

    <div id="app" class="w-full h-full max-w-4xl bg-ivory shadow-xl flex flex-col relative overflow-hidden md:rounded-lg">
        
        <!-- 토스트 메시지 (alert 대체) -->
        <div id="toast" class="absolute top-4 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-full text-white font-bold opacity-0 transition-opacity duration-300 z-50 pointer-events-none" style="background-color: #6B8E23;">
            메시지
        </div>

        <div id="screen-main" class="flex flex-col h-full p-6 w-full fade-in z-10 bg-ivory absolute inset-0">
            <div class="flex-1 flex flex-col justify-center items-center">
                <div class="text-sage text-5xl mb-4"><i class="fas fa-book-open"></i></div>
                <h1 class="text-2xl font-bold text-charcoal mb-2">능률VOCA (어원편)</h1>
                <p class="text-gray-500 mb-8 text-center text-sm">오답 무한 루프 & 스마트 채점</p>

                <!-- 옵션 선택 폼 -->
                <div class="w-full max-w-sm space-y-5 bg-cardBg p-5 rounded-2xl shadow-sm border border-gray-100">
                    <!-- 파일 자동 로드 상태 표시 영역 -->
                    <div class="text-center pb-2 border-b border-gray-100">
                        <span id="loading-status" class="text-sm font-bold text-gray-500">단어장 데이터 불러오는 중... <i class="fas fa-spinner fa-spin"></i></span>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-2">학습 단원 (DAY)</label>
                        <select id="day-select" class="w-full p-3 rounded-xl bg-gray-50 border border-gray-200 outline-none focus:ring-2 focus:ring-sage transition">
                            <option value="">데이터 로딩중...</option>
                        </select>
                    </div>

                    <!-- 유형 필터 추가 -->
                    <div>
                        <label class="block text-sm font-semibold mb-2">단어 유형</label>
                        <select id="type-select" class="w-full p-3 rounded-xl bg-gray-50 border border-gray-200 outline-none focus:ring-2 focus:ring-sage transition">
                            <option value="all">전체 학습 (표제어+파생어)</option>
                            <option value="표">표제어만 학습</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold mb-2">학습 모드</label>
                        <div class="flex gap-2">
                            <button onclick="setQuizMode('A')" id="btn-mode-a" class="flex-1 py-3 rounded-xl border-2 border-sage bg-sage/10 text-sage font-bold transition">뜻 맞히기</button>
                            <button onclick="setQuizMode('B')" id="btn-mode-b" class="flex-1 py-3 rounded-xl border-2 border-transparent bg-gray-100 text-gray-500 font-bold transition">단어 맞히기</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">입력 방식</label>
                        <div class="flex gap-2">
                            <button onclick="setInputMode('keyboard')" id="btn-input-key" class="flex-1 py-3 rounded-xl border-2 border-sage bg-sage/10 text-sage font-bold transition"><i class="fas fa-keyboard mr-2"></i>키보드</button>
                            <button onclick="setInputMode('canvas')" id="btn-input-pen" class="flex-1 py-3 rounded-xl border-2 border-transparent bg-gray-100 text-gray-500 font-bold transition"><i class="fas fa-pen mr-2"></i>필기(태블릿)</button>
                        </div>
                    </div>
                </div>

                <button onclick="startQuiz()" class="mt-8 w-full max-w-sm bg-sage text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-opacity-90 transition transform active:scale-95">
                    학습 시작하기
                </button>
            </div>
        </div>

        <div id="screen-quiz" class="hidden flex-col h-full w-full bg-ivory absolute inset-0 z-10">
            <!-- 상단 헤더 (진행도) -->
            <div class="h-16 flex items-center justify-between px-4 border-b border-gray-200 bg-cardBg shrink-0">
                <button onclick="quitQuiz()" class="p-2 text-gray-400 hover:text-coral transition"><i class="fas fa-times text-xl"></i></button>
                <div class="flex-1 px-4">
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-sage h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
                <div class="text-sm font-bold text-charcoal bg-gray-100 px-3 py-1 rounded-full">
                    남은단어 <span id="remain-count" class="text-coral">0</span>
                </div>
            </div>

            <!-- 메인 컨텐츠 영역 (태블릿이면 좌우 분할 flex-row) -->
            <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
                
                <!-- 문제 카드 영역 (좌측/상단) -->
                <div class="flex-1 flex flex-col items-center justify-center p-6 md:border-r border-gray-200 bg-ivory">
                    <div class="text-center w-full max-w-md bg-cardBg rounded-3xl shadow-sm border border-gray-100 p-8 flex flex-col items-center justify-center min-h-[250px] relative">
                        <span id="word-type-badge" class="absolute top-4 left-4 text-xs font-bold bg-gray-100 text-gray-500 px-2 py-1 rounded">표제어</span>
                        <div class="text-gray-400 text-sm mb-2 font-medium" id="question-label">다음 단어의 뜻은?</div>
                        <div class="text-3xl md:text-5xl font-bold text-charcoal break-words text-center" id="current-question">progress</div>
                        <div id="hint-box" class="mt-4 text-sm font-medium text-sage bg-sage/10 px-3 py-1 rounded-full hidden">
                            💡 뜻 2가지를 적어주세요.
                        </div>
                    </div>
                </div>

                <div class="w-full md:w-1/2 p-4 md:p-6 flex flex-col bg-cardBg shrink-0 justify-end md:justify-center z-20 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] md:shadow-none rounded-t-3xl md:rounded-none transition-transform duration-300 transform translate-y-0 relative">
                    
                    <!-- 정답 피드백 오버레이 -->
                    <div id="feedback-overlay" class="absolute inset-0 bg-white/90 z-30 flex flex-col items-center justify-center hidden backdrop-blur-sm rounded-t-3xl md:rounded-none">
                        <div id="feedback-icon" class="text-6xl mb-4"><i class="fas fa-check-circle text-sage"></i></div>
                        <div id="feedback-correct-answer" class="text-xl font-bold text-charcoal text-center px-4">정답 내용</div>
                    </div>

                    <!-- 1. 키보드 입력 모드 UI -->
                    <div id="keyboard-input-area" class="w-full flex flex-col gap-3">
                        <div id="dynamic-inputs" class="flex flex-col gap-2 w-full max-h-[30vh] overflow-y-auto px-1 py-2">
                            <!-- JS로 input 태그 자동 생성 -->
                        </div>
                        <button onclick="submitAnswer()" class="w-full bg-charcoal text-white py-4 rounded-xl font-bold text-lg mt-2 active:scale-95 transition">확인 (제출)</button>
                    </div>

                    <!-- 2. 캔버스 (필기) 입력 모드 UI -->
                    <div id="canvas-input-area" class="w-full hidden flex-col h-[40vh] md:h-full max-h-[500px]">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs text-gray-400"><i class="fas fa-pen text-sage mr-1"></i>손글씨를 인식합니다</span>
                            <button onclick="clearCanvas()" class="text-xs text-coral bg-coral/10 px-2 py-1 rounded"><i class="fas fa-eraser mr-1"></i>지우기</button>
                        </div>
                        <canvas id="drawing-canvas" class="flex-1 bg-gray-50 border-2 border-gray-200 rounded-xl w-full touch-none shadow-inner"></canvas>
                        
                        <!-- OCR 인식 보조 입력창 (수정용) -->
                        <div class="mt-3">
                            <input type="text" id="ocr-fallback-input" placeholder="인식된 텍스트 수정 (수동 입력 가능)" class="w-full p-3 rounded-lg border border-gray-300 outline-none focus:border-sage text-sm mb-2" onkeydown="if(event.key === 'Enter') submitAnswer()">
                            <button onclick="submitAnswer()" class="w-full bg-charcoal text-white py-3 rounded-xl font-bold active:scale-95 transition">인식 및 제출</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="screen-result" class="hidden flex-col items-center justify-center h-full p-6 w-full z-10 bg-ivory absolute inset-0">
            <div class="text-sage text-6xl mb-6"><i class="fas fa-award"></i></div>
            <h2 class="text-3xl font-bold text-charcoal mb-2">학습 완료!</h2>
            <p class="text-gray-500 mb-8 text-center">오답 무한 루프를 통과하여<br>모든 단어를 완벽히 숙지했습니다.</p>
            
            <div class="bg-cardBg w-full max-w-sm rounded-2xl p-6 shadow-sm border border-gray-100 mb-8 text-center">
                <div class="text-sm text-gray-400 mb-1">총 학습 단어</div>
                <div class="text-4xl font-bold text-charcoal" id="result-total-words">0</div>
            </div>

            <button onclick="goMain()" class="w-full max-w-sm bg-sage text-white py-4 rounded-xl font-bold text-lg shadow-lg active:scale-95 transition">
                메인으로 돌아가기
            </button>
        </div>

    </div>

    <script>
        // --- 1. 데이터 베이스 ---
        let fullVocaData = []; // 엑셀에서 파싱된 전체 데이터 저장용
        
        async function loadExcelFromUrl() {
            try {
                // 엑셀 파일명을 nyvoca.xlsx 로 지정 (같은 폴더 내 위치)
                const fileName = "nyvoca.xlsx";
                const url = encodeURI(fileName);
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error("네트워크 응답이 정상이 아닙니다. 파일을 찾을 수 없습니다.");
                }
                
                const arrayBuffer = await response.arrayBuffer();
                const data = new Uint8Array(arrayBuffer);
                const workbook = XLSX.read(data, {type: 'array'});
                
                // '어휘리스트_의미축소' 시트 우선 탐색, 없으면 첫 번째 시트 사용
                let sheetName = workbook.SheetNames.includes('어휘리스트_의미축소') ? '어휘리스트_의미축소' : workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                
                // JSON으로 변환 (첫 줄을 헤더로 사용)
                const json = XLSX.utils.sheet_to_json(worksheet);
                
                fullVocaData = [];
                const daySet = new Set();

                // 필요한 컬럼 추출 및 정제
                json.forEach(row => {
                    const day = row['단원'] || row['DAY'] || '';
                    const type = row['유형'] || '표';
                    const word = row['영단어'] || row['단어'] || '';
                    const meaning = row['한글 뜻'] || row['뜻'] || '';

                    if(word && meaning) {
                        fullVocaData.push({ day, type, word, meaning });
                        if(day) daySet.add(day);
                    }
                });

                // DAY 셀렉트박스 업데이트
                const daySelect = document.getElementById('day-select');
                daySelect.innerHTML = '';
                
                if(daySet.size === 0) {
                    daySelect.innerHTML = '<option value="all">전체 (DAY 구분 없음)</option>';
                } else {
                    const sortedDays = Array.from(daySet).sort();
                    daySelect.innerHTML = '<option value="all">전체 DAY 학습</option>';
                    sortedDays.forEach(day => {
                        const option = document.createElement('option');
                        option.value = day;
                        option.innerText = day;
                        daySelect.appendChild(option);
                    });
                }

                // 상태 표시줄 업데이트 (성공)
                document.getElementById('loading-status').innerHTML = '데이터 로드 완료! <i class="fas fa-check text-sage"></i>';
                document.getElementById('loading-status').className = 'text-sm font-bold text-sage';

            } catch (error) {
                console.error("Excel Fetch Error:", error);
                // 상태 표시줄 업데이트 (실패)
                document.getElementById('loading-status').innerHTML = '단어장 파일을 찾을 수 없습니다. <i class="fas fa-exclamation-triangle"></i>';
                document.getElementById('loading-status').className = 'text-sm font-bold text-coral';
                showToast("엑셀 파일을 불러오는 중 오류가 발생했습니다.", "#E57373");
            }
        }

        // --- 2. 앱 상태 변수 ---
        let currentMode = 'A'; // A: 영->한 (뜻 맞히기), B: 한->영 (단어 맞히기)
        let currentInputMode = 'keyboard'; // keyboard or canvas
        let wordQueue = []; // 현재 시험중인 큐 (오답시 뒤로 감)
        let totalWordCount = 0;
        let currentQuestionObj = null;

        // --- 3. UI 설정 관련 함수 ---
        function setQuizMode(mode) {
            currentMode = mode;
            document.getElementById('btn-mode-a').className = mode === 'A' ? "flex-1 py-3 rounded-xl border-2 border-sage bg-sage/10 text-sage font-bold transition" : "flex-1 py-3 rounded-xl border-2 border-transparent bg-gray-100 text-gray-500 font-bold transition";
            document.getElementById('btn-mode-b').className = mode === 'B' ? "flex-1 py-3 rounded-xl border-2 border-sage bg-sage/10 text-sage font-bold transition" : "flex-1 py-3 rounded-xl border-2 border-transparent bg-gray-100 text-gray-500 font-bold transition";
        }

        function setInputMode(mode) {
            currentInputMode = mode;
            document.getElementById('btn-input-key').className = mode === 'keyboard' ? "flex-1 py-3 rounded-xl border-2 border-sage bg-sage/10 text-sage font-bold transition" : "flex-1 py-3 rounded-xl border-2 border-transparent bg-gray-100 text-gray-500 font-bold transition";
            document.getElementById('btn-input-pen').className = mode === 'canvas' ? "flex-1 py-3 rounded-xl border-2 border-sage bg-sage/10 text-sage font-bold transition" : "flex-1 py-3 rounded-xl border-2 border-transparent bg-gray-100 text-gray-500 font-bold transition";
        }

        function showToast(msg, color = '#6B8E23') {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.backgroundColor = color;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 1500);
        }

        function switchScreen(screenId) {
            document.getElementById('screen-main').classList.add('hidden');
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.add('hidden');
            
            const target = document.getElementById(screenId);
            target.classList.remove('hidden');
            target.classList.add('flex');
            
            // 캔버스 크기 재조정을 위해 화면이 보인 후 리사이즈
            if(screenId === 'screen-quiz' && currentInputMode === 'canvas') {
                setTimeout(resizeCanvas, 100);
            }
        }

        // --- STREAMING_CHUNK:퀴즈 진행 핵심 로직 ---
        function startQuiz() {
            if (fullVocaData.length === 0) {
                showToast("단어장 엑셀 파일을 먼저 업로드해주세요!", "#E57373");
                return;
            }

            const selectedDay = document.getElementById('day-select').value;
            const selectedType = document.getElementById('type-select').value;

            // 조건에 맞는 단어 필터링
            let filteredData = fullVocaData;
            if (selectedDay !== 'all') {
                filteredData = filteredData.filter(item => item.day === selectedDay);
            }
            if (selectedType !== 'all') {
                filteredData = filteredData.filter(item => item.type === selectedType);
            }

            if (filteredData.length === 0) {
                showToast("해당 조건에 맞는 단어가 없습니다.", "#E57373");
                return;
            }

            // 단어 출제 순서를 무작위로 섞기 (셔플)
            filteredData.sort(() => Math.random() - 0.5);

            // 깊은 복사로 큐 초기화
            wordQueue = JSON.parse(JSON.stringify(filteredData));
            totalWordCount = wordQueue.length;
            
            // UI 초기화
            document.getElementById('keyboard-input-area').classList.toggle('hidden', currentInputMode !== 'keyboard');
            document.getElementById('canvas-input-area').classList.toggle('hidden', currentInputMode !== 'canvas');
            
            switchScreen('screen-quiz');
            loadNextQuestion();
        }

        function quitQuiz() {
            switchScreen('screen-main');
        }

        function loadNextQuestion() {
            if (wordQueue.length === 0) {
                // 무한 루프 종료!
                document.getElementById('result-total-words').innerText = totalWordCount;
                switchScreen('screen-result');
                return;
            }

            // 큐의 첫번째 요소를 가져옴
            currentQuestionObj = wordQueue[0];
            
            // UI 업데이트
            document.getElementById('remain-count').innerText = wordQueue.length;
            const progress = ((totalWordCount - wordQueue.length) / totalWordCount) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('word-type-badge').innerText = currentQuestionObj.type === '표' ? '표제어' : '파생어';

            const dynamicInputs = document.getElementById('dynamic-inputs');
            dynamicInputs.innerHTML = '';
            document.getElementById('ocr-fallback-input').value = '';
            clearCanvas();

            // 모드에 따른 출제
            if (currentMode === 'A') { // 영단어 제시 -> 한글 뜻
                document.getElementById('question-label').innerText = "다음 단어의 뜻은?";
                document.getElementById('current-question').innerText = currentQuestionObj.word;
                
                // 세미콜론 분할 개수 파악
                const meaningGroups = currentQuestionObj.meaning.split(';');
                const groupCount = meaningGroups.length;

                // 힌트 업데이트
                const hintBox = document.getElementById('hint-box');
                if (groupCount > 1) {
                    hintBox.innerText = `💡 뜻 ${groupCount}가지를 적어주세요.`;
                    hintBox.classList.remove('hidden');
                } else {
                    hintBox.classList.add('hidden');
                }

                // 키보드 모드일 때 동적 input 생성
                if (currentInputMode === 'keyboard') {
                    for (let i = 0; i < groupCount; i++) {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'w-full p-4 rounded-xl border-2 border-gray-200 outline-none focus:border-sage transition text-lg bg-gray-50 user-answer-input';
                        input.placeholder = `뜻 ${i + 1}`;
                        if(i === 0) setTimeout(() => input.focus(), 100); // 자동 포커스
                        input.onkeydown = (e) => {
                            if (e.key === 'Enter') {
                                if (i < groupCount - 1) dynamicInputs.children[i+1].focus();
                                else submitAnswer();
                            }
                        };
                        dynamicInputs.appendChild(input);
                    }
                }

            } else { // 모드 B: 한글 뜻 제시 -> 영단어
                document.getElementById('question-label').innerText = "다음 뜻을 가진 영단어는?";
                document.getElementById('current-question').innerText = currentQuestionObj.meaning;
                document.getElementById('hint-box').classList.add('hidden');

                if (currentInputMode === 'keyboard') {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'w-full p-4 rounded-xl border-2 border-gray-200 outline-none focus:border-sage transition text-lg bg-gray-50 user-answer-input font-bold';
                    input.placeholder = "영단어 입력";
                    setTimeout(() => input.focus(), 100);
                    input.onkeydown = (e) => { if (e.key === 'Enter') submitAnswer(); };
                    dynamicInputs.appendChild(input);
                }
            }
        }

        // --- STREAMING_CHUNK:채점 및 큐 무한루프 로직 ---
        function submitAnswer() {
            let isCorrect = false;
            let userAnswers = [];

            // 값 수집
            if (currentInputMode === 'keyboard') {
                const inputs = document.querySelectorAll('.user-answer-input');
                inputs.forEach(input => userAnswers.push(input.value.trim()));
            } else {
                // 캔버스 모드 (보조 텍스트 인풋에서 값 수집 - 실제 OCR 연동부)
                // (현재 프로토타입은 수동 입력창 값을 OCR 인식 결과로 가정함)
                const val = document.getElementById('ocr-fallback-input').value.trim();
                if(currentMode === 'A') {
                    // 캔버스에서 쉼표나 공백으로 여러 개를 썼다고 가정하여 분할
                    userAnswers = val.split(/[, ]+/).filter(v => v);
                } else {
                    userAnswers = [val];
                }
            }

            // 채점
            if (currentMode === 'A') {
                // 세미콜론 검증 로직
                const requiredGroups = currentQuestionObj.meaning.split(';').map(g => 
                    g.split(',').map(m => m.trim().replace(/\s+/g, ''))
                );
                
                const cleanedUserAnswers = userAnswers.map(ans => ans.trim().replace(/\s+/g, ''));

                // 모든 그룹에서 최소 1개의 정답이 매칭되는지 확인 (AND)
                isCorrect = requiredGroups.every(group => {
                    return group.some(validMeaning => cleanedUserAnswers.includes(validMeaning));
                });
            } else {
                // 영단어 검증 로직
                isCorrect = userAnswers[0] && userAnswers[0].toLowerCase() === currentQuestionObj.word.toLowerCase();
            }

            handleResult(isCorrect);
        }

        function handleResult(isCorrect) {
            const overlay = document.getElementById('feedback-overlay');
            const icon = document.getElementById('feedback-icon');
            const ansText = document.getElementById('feedback-correct-answer');
            const inputContainer = document.getElementById('keyboard-input-area').classList.contains('hidden') ? 
                                   document.getElementById('canvas-input-area') : document.getElementById('keyboard-input-area');

            overlay.classList.remove('hidden');
            
            if (isCorrect) {
                // 정답 로직
                icon.innerHTML = '<i class="fas fa-check-circle text-sage text-6xl fade-in"></i>';
                ansText.innerHTML = '<span class="text-sage">정답!</span>';
                
                // 큐에서 제거
                wordQueue.shift();
                
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    loadNextQuestion();
                }, 800);

            } else {
                // 오답 로직 (무한루프 핵심)
                inputContainer.classList.add('shake');
                setTimeout(() => inputContainer.classList.remove('shake'), 400);

                icon.innerHTML = '<i class="fas fa-times-circle text-coral text-6xl fade-in"></i>';
                const correctStr = currentMode === 'A' ? currentQuestionObj.meaning : currentQuestionObj.word;
                ansText.innerHTML = `<div class="text-coral mb-2">오답입니다</div><div class="text-sm font-normal text-gray-500">정답: <strong class="text-charcoal">${correctStr}</strong></div>`;
                
                // 큐의 맨 뒤로 보냄 (맨 앞 제거 후 뒤에 push)
                const wrongWord = wordQueue.shift();
                wordQueue.push(wrongWord);

                setTimeout(() => {
                    overlay.classList.add('hidden');
                    loadNextQuestion();
                }, 1800); // 오답은 확인을 위해 1.8초 노출
            }
        }

        function goMain() {
            switchScreen('screen-main');
        }

        // --- STREAMING_CHUNK:캔버스 (손글씨) 드로잉 구현 ---
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            // css width/height와 내부 픽셀 매칭
            canvas.width = rect.width;
            // 패딩, 마진등 고려한 높이 할당
            canvas.height = canvas.offsetHeight; 
            
            // 스타일 초기화
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#333333';
        }

        window.addEventListener('resize', () => {
            if(!document.getElementById('screen-quiz').classList.contains('hidden') && currentInputMode === 'canvas'){
                resizeCanvas();
            }
        });

        // Pointer Events 사용 (마우스, 터치, 펜 통합 지원 및 Palm rejection 가능)
        canvas.addEventListener('pointerdown', (e) => {
            // 태블릿 환경에서는 펜만 허용하려면 아래 주석 해제
            // if(e.pointerType !== 'pen' && e.pointerType !== 'mouse') return; 
            
            drawing = true;
            ctx.beginPath();
            const rect = canvas.getBoundingClientRect();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        });

        canvas.addEventListener('pointerup', () => drawing = false);
        canvas.addEventListener('pointerout', () => drawing = false);

        function clearCanvas() {
            if(ctx) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        window.onload = () => {
            // 앱 실행 시 엑셀 파일 자동 로드
            loadExcelFromUrl();
        };
    </script>
</body>
</html>
