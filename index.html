<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NE VOCA 어원편</title>
  <style>
/* ==========================================================================
   NE VOCA 어원편 — Aptivo-Inspired Warm Cream & Coral Page-Based UI
   4-Page Screen Architecture:
   [1. 홈] -> [2. 설정] -> [3. 암기 (플래시 카드 / 단어테스트)] -> [4. 결과 페이지]
   ========================================================================== */

:root {
  --bg-outer: #EAE3DC;
  --bg-screen: #FDF7F0;
  --bg-card: #FFFFFF;
  --bg-soft-input: #F4EDE4;

  --coral: #EE634B;
  --coral-hover: #DF523A;
  --coral-soft: #FCE8E4;

  /* Aptivo Pastel Category Tile Colors */
  --tile-blue: #498AF4;
  --tile-mint: #5EC2A7;
  --tile-purple: #8A74D8;
  --tile-pink: #D25889;
  --tile-green: #69A829;
  --tile-amber: #EBA028;

  --text-dark: #252422;
  --text-mid: #635F5B;
  --text-muted: #98928C;

  --correct: #379956;
  --correct-bg: #E8F6EC;
  --wrong: #D94E4E;
  --wrong-bg: #FDECEC;

  --border-light: #ECE4DC;
  --border-mid: #DDD2C7;

  --shadow-device: 0 20px 50px rgba(37, 36, 34, 0.14);
  --shadow-card: 0 6px 18px rgba(37, 36, 34, 0.06);
  --shadow-btn: 0 6px 16px rgba(238, 99, 75, 0.28);

  --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
  --font-display: 'Plus Jakarta Sans', 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: var(--bg-outer);
  font-family: var(--font-sans);
  color: var(--text-dark);
  display: flex;
  align-items: center;
  justify-content: center;
}

button, span, label {
  white-space: nowrap;
  word-break: keep-all;
}

/* ==========================================================================
   Device Frame Container (모바일 / 테블릿)
   ========================================================================== */
.device-frame {
  position: relative;
  width: 100%;
  height: 100vh;
  max-height: 850px;
  background: var(--bg-screen);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  transition: max-width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: var(--shadow-device);
}

.device-frame.view-mobile {
  max-width: 430px;
  border-radius: 38px;
  border: 7px solid #262523;
}

.device-frame.view-tablet {
  max-width: 980px;
  max-height: 740px;
  border-radius: 32px;
  border: 8px solid #262523;
}

@media (max-width: 500px) {
  .device-frame.view-mobile {
    max-width: 100%;
    max-height: 100vh;
    border-radius: 0;
    border: none;
  }
}



.pages-viewport {
  position: relative;
  flex: 1;
  width: 100%;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.app-page {
  display: none;
  flex-direction: column;
  justify-content: space-between;
  width: 100%;
  height: 100%;
  padding: 8px 18px 18px;
  overflow: hidden;
  animation: pageFade 0.24s cubic-bezier(0.22, 1, 0.36, 1);
}

.app-page.active-page {
  display: flex;
}

@keyframes pageFade {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ==========================================================================
   PAGE 1: 홈 (Home Screen — Title, Mascot, '시작하기' Button, Bottom OLIVE Logo)
   ========================================================================== */
.home-inner {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  text-align: center;
  padding: 18px 8px 4px;
}

.home-title-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 8px;
}

.app-main-title {
  font-family: var(--font-display);
  font-size: 34px;
  font-weight: 900;
  color: var(--coral);
  letter-spacing: -0.8px;
  margin: 0;
  line-height: 1.15;
}

.view-tablet .app-main-title {
  font-size: 42px;
}

.petal-mascot-box {
  width: 195px;
  height: 195px;
  margin: auto 0;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: floatMascot 3.2s ease-in-out infinite;
}

.view-tablet .petal-mascot-box {
  width: 230px;
  height: 230px;
}

@keyframes floatMascot {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-7px); }
}

.home-bottom-action {
  width: 100%;
  max-width: 350px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.view-tablet .home-bottom-action {
  max-width: 420px;
}

.home-logo-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 2px;
}

.home-logo-img {
  height: 44px;
  width: auto;
  max-width: 180px;
  object-fit: contain;
  display: block;
}

.view-tablet .home-logo-img {
  height: 52px;
  max-width: 210px;
}

.btn-coral-pill {
  width: 100%;
  background: var(--coral);
  color: #FFFFFF;
  border: none;
  border-radius: 999px;
  padding: 15px 22px;
  font-size: 16.5px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: var(--shadow-btn);
  transition: all 0.18s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  white-space: nowrap;
  flex-shrink: 0;
}

.btn-coral-pill:hover {
  background: var(--coral-hover);
  transform: translateY(-1px);
}

.btn-cream-pill {
  width: 100%;
  background: var(--bg-card);
  color: var(--text-dark);
  border: 1.5px solid var(--border-mid);
  border-radius: 999px;
  padding: 13px 18px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.18s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
  flex-shrink: 0;
}

.btn-cream-pill:hover {
  border-color: var(--coral);
  color: var(--coral);
}

.mini-pill-btn {
  background: var(--bg-card);
  color: var(--text-dark);
  border: 1.5px solid var(--border-mid);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.mini-pill-btn.active {
  background: var(--coral);
  color: #fff;
  border-color: var(--coral);
}

/* ==========================================================================
   PAGE 2: 설정 (Settings Screen — Clean, No Numbers, Zero Empty Spaces)
   ========================================================================== */
.settings-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  flex-shrink: 0;
}

.settings-title {
  font-size: 20px;
  font-weight: 900;
  color: var(--text-dark);
  margin: 0;
  white-space: nowrap;
}

.settings-clean-stack {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 8px;
}

.view-tablet .settings-clean-stack {
  max-width: 820px;
  width: 100%;
  margin: 0 auto;
  gap: 10px;
}

.clean-option-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%;
}

.view-tablet .clean-option-row {
  gap: 16px;
}

.clean-choice-btn {
  border: 2px solid var(--border-light);
  border-radius: 18px;
  padding: 15px 10px;
  font-size: 15.5px;
  font-weight: 800;
  background: var(--bg-card);
  color: var(--text-mid);
  cursor: pointer;
  transition: all 0.18s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: var(--shadow-card);
  white-space: nowrap;
}

.view-tablet .clean-choice-btn {
  padding: 17px 18px;
  font-size: 17px;
  border-radius: 20px;
}

.clean-choice-btn.tile-blue.active {
  background: var(--tile-blue);
  border-color: var(--tile-blue);
  color: #FFFFFF;
  box-shadow: 0 6px 16px rgba(73, 138, 244, 0.32);
}

.clean-choice-btn.tile-mint.active {
  background: var(--tile-mint);
  border-color: var(--tile-mint);
  color: #FFFFFF;
  box-shadow: 0 6px 16px rgba(94, 194, 167, 0.32);
}

.clean-choice-btn.tile-purple.active {
  background: var(--tile-purple);
  border-color: var(--tile-purple);
  color: #FFFFFF;
  box-shadow: 0 6px 16px rgba(138, 116, 216, 0.32);
}

.clean-choice-btn.tile-pink.active {
  background: var(--tile-pink);
  border-color: var(--tile-pink);
  color: #FFFFFF;
  box-shadow: 0 6px 16px rgba(210, 88, 137, 0.32);
}

.clean-choice-btn.tile-green.active {
  background: var(--tile-green);
  border-color: var(--tile-green);
  color: #FFFFFF;
  box-shadow: 0 6px 16px rgba(105, 168, 41, 0.32);
}

.clean-choice-btn.tile-amber.active {
  background: var(--tile-amber);
  border-color: var(--tile-amber);
  color: #FFFFFF;
  box-shadow: 0 6px 16px rgba(235, 160, 40, 0.32);
}

/* 범위 (시작 단어) ~ (끝 단어) Card */
.clean-range-card {
  background: var(--bg-card);
  border: 2px solid var(--border-light);
  border-radius: 18px;
  padding: 11px 13px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.view-tablet .clean-range-card {
  flex-direction: row;
  align-items: center;
  padding: 13px 18px;
  gap: 14px;
  border-radius: 20px;
}

.range-label-title {
  font-size: 14.5px;
  font-weight: 900;
  color: var(--text-dark);
  white-space: nowrap;
}

.view-tablet .range-label-title {
  font-size: 16.5px;
  min-width: 44px;
}

.range-inputs-grid {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 8px;
  width: 100%;
}

.input-rel-wrap {
  position: relative;
  width: 100%;
  min-width: 0;
}

.clean-word-input {
  width: 100%;
  min-width: 0;
  padding: 10px 8px;
  border-radius: 12px;
  border: 1.5px solid var(--border-mid);
  background: var(--bg-soft-input);
  color: var(--text-dark);
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 800;
  text-align: center;
  outline: none;
  transition: all 0.16s;
}

.clean-word-input:focus {
  border-color: var(--coral);
  background: var(--bg-card);
}

.autocomplete-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--bg-card);
  border: 1.5px solid var(--coral);
  border-radius: 12px;
  max-height: 150px;
  overflow-y: auto;
  z-index: 90;
  box-shadow: var(--shadow-card);
  display: none;
}

.autocomplete-dropdown.open {
  display: block;
}

.ac-row {
  padding: 7px 10px;
  font-size: 12px;
  border-bottom: 1px solid var(--border-light);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
}

.ac-row:hover {
  background: var(--coral-soft);
}

/* ==========================================================================
   PAGE 3: 암기 (플래시 카드 & 단어테스트 화면 — 줄바꿈 및 버튼 잘림 완벽 방지)
   ========================================================================== */
.study-header-wrap {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 8px;
  flex-shrink: 0;
}

.study-top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  width: 100%;
}

.study-nav-left {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.study-nav-center {
  font-size: 13px;
  font-weight: 900;
  color: var(--text-dark);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.study-nav-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.study-progress-pill {
  width: 100%;
  height: 8px;
  background: var(--bg-soft-input);
  border-radius: 999px;
  overflow: hidden;
}

.study-progress-fill {
  height: 100%;
  background: var(--coral);
  border-radius: 999px;
  transition: width 0.28s ease;
}

.study-stage-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  gap: 10px;
  min-width: 0;
}

.view-tablet .study-stage-body.tablet-test-split {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 16px;
  align-items: stretch;
}

.mascot-card-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  padding-top: 22px;
  min-height: 0;
  min-width: 0;
}

.peeking-eyes-header {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 84px;
  height: 34px;
  background: var(--coral);
  border-radius: 40px 40px 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  z-index: 5;
  border: 2px solid #252422;
  border-bottom: none;
}

.peeking-eye {
  width: 22px;
  height: 22px;
  background: #fff;
  border-radius: 50%;
  border: 2px solid #252422;
  display: flex;
  align-items: center;
  justify-content: center;
}

.peeking-pupil {
  width: 11px;
  height: 11px;
  background: #252422;
  border-radius: 50%;
  position: relative;
}

.peeking-pupil::after {
  content: '';
  position: absolute;
  top: 2px;
  right: 2px;
  width: 3.5px;
  height: 3.5px;
  background: #fff;
  border-radius: 50%;
}

.fc-scene {
  flex: 1;
  perspective: 1100px;
  cursor: pointer;
  user-select: none;
  position: relative;
  min-height: 0;
}

.fc-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.48s cubic-bezier(0.22, 1, 0.36, 1);
}

.fc-scene.is-flipped .fc-inner {
  transform: rotateY(180deg);
}

.fc-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: var(--bg-card);
  border: 2px solid var(--border-light);
  border-radius: 26px;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.fc-back {
  transform: rotateY(180deg);
  background: #FFFDFB;
  border-color: var(--coral);
}

.word-hero-text {
  font-family: var(--font-display);
  font-size: 34px;
  font-weight: 900;
  color: var(--text-dark);
  margin: 0 0 8px;
  word-break: break-word;
  white-space: normal;
}

.meaning-hero-text {
  font-size: 21px;
  font-weight: 800;
  color: var(--text-dark);
  line-height: 1.42;
  margin: 0 0 8px;
  word-break: keep-all;
  white-space: normal;
}

.pos-pill {
  background: #FDF3E1;
  color: #B87300;
  font-size: 12px;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 999px;
  white-space: nowrap;
  flex-shrink: 0;
}

.test-card-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: var(--bg-card);
  border: 2px solid var(--border-light);
  border-radius: 26px;
  padding: 18px 16px 14px;
  box-shadow: var(--shadow-card);
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}

.test-answer-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  margin-top: 8px;
  width: 100%;
  align-items: center;
}

.test-input-field {
  width: 100%;
  min-width: 0; /* Critical fix so input never pushes submit button off-screen */
  padding: 12px 14px;
  border-radius: 999px;
  border: 2px solid var(--border-mid);
  background: var(--bg-soft-input);
  color: var(--text-dark);
  font-size: 14.5px;
  font-weight: 800;
  outline: none;
}

.test-input-field:focus {
  border-color: var(--coral);
  background: var(--bg-card);
}

.inline-feedback-box {
  margin-top: 8px;
  padding: 9px 12px;
  border-radius: 14px;
  font-size: 12px;
  display: none;
  white-space: normal;
  word-break: keep-all;
}

.inline-feedback-box.correct {
  display: block;
  background: var(--correct-bg);
  color: var(--correct);
  border: 1.5px solid var(--correct);
}

.inline-feedback-box.wrong {
  display: block;
  background: var(--wrong-bg);
  color: var(--wrong);
  border: 1.5px solid var(--wrong);
}

/* Tablet Handwriting Pad */
.tablet-hw-panel {
  background: var(--bg-card);
  border: 2px solid var(--tile-mint);
  border-radius: 26px;
  padding: 16px;
  display: none;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--shadow-card);
  min-height: 0;
  min-width: 0;
}

.hw-canvas-box {
  position: relative;
  flex: 1;
  min-height: 150px;
  background: #FCFBF9;
  border: 2px dashed var(--border-mid);
  border-radius: 18px;
  overflow: hidden;
  touch-action: none;
  margin: 8px 0;
}

#hwCanvas {
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
  touch-action: none;
}

/* ==========================================================================
   PAGE 4: 결과 페이지 (다시 학습하기, 오답 학습하기, 홈, 설정)
   ========================================================================== */
.result-streak-banner {
  background: var(--coral);
  color: #FFFFFF;
  border-radius: 22px;
  padding: 15px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  box-shadow: var(--shadow-btn);
  flex-shrink: 0;
}

.result-stats-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 10px 0;
  flex-shrink: 0;
}

.result-stat-card {
  background: var(--bg-card);
  border: 1.5px solid var(--border-light);
  border-radius: 16px;
  padding: 10px 6px;
  text-align: center;
  box-shadow: var(--shadow-card);
}

.result-stat-num {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 900;
  color: var(--text-dark);
}

.result-stat-label {
  font-size: 11px;
  color: var(--text-mid);
  font-weight: 700;
}

.result-wrong-scroll-box {
  flex: 1;
  background: var(--bg-card);
  border: 1.5px solid var(--border-light);
  border-radius: 18px;
  padding: 10px 12px;
  overflow-y: auto;
  min-height: 0;
  margin-bottom: 10px;
}

.result-action-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 8px;
  flex-shrink: 0;
}

  </style>
</head>
<body>
  <div class="device-frame view-mobile" id="deviceFrame">


    <!-- Main Multi-Page Viewport -->
    <div class="pages-viewport">

      <!-- ====================================================================
           PAGE 1: 홈 (앱 이름 'NE VOCA 어원편', 마스코트, '시작하기' 버튼, 하단 OLIVE 로고)
           ==================================================================== -->
      <section class="app-page active-page" id="pageHome">
        <div class="home-inner">
          <div class="home-title-area">
            <h1 class="app-main-title">NE VOCA 어원편</h1>
          </div>

          <!-- Cute Aptivo Flower Mascot -->
          <div class="petal-mascot-box">
            <svg viewBox="0 0 220 220" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
              <g transform="translate(110, 110)">
                <circle cx="0" cy="-54" r="38" fill="#EE634B" stroke="#252422" stroke-width="5"/>
                <circle cx="51" cy="-17" r="38" fill="#EE634B" stroke="#252422" stroke-width="5"/>
                <circle cx="32" cy="44" r="38" fill="#EE634B" stroke="#252422" stroke-width="5"/>

      <section class="app-page" id="pageSettings">
        <div class="settings-header">
          <button type="button" class="mini-pill-btn" id="settingsBackHomeBtn">🏠 홈</button>
          <h2 class="settings-title">설정</h2>
          <span style="width:52px;"></span>
        </div>

        <div class="settings-clean-stack">
          <!-- 표제어 / 파생어 포함 -->
          <div class="clean-option-row">
            <button type="button" class="clean-choice-btn tile-blue active" id="tileSource01">
              표제어
            </button>
            <button type="button" class="clean-choice-btn tile-mint" id="tileSource02">
              파생어 포함
            </button>
          </div>

            <div class="range-inputs-grid">
              <div class="input-rel-wrap">
                <input type="text" id="startWordInput" class="clean-word-input" value="progress" placeholder="시작 단어" autocomplete="off">
                <div id="startAcDrop" class="autocomplete-dropdown"></div>
              </div>
              <span style="font-weight:900;font-size:18px;color:var(--text-mid);">~</span>
              <div class="input-rel-wrap">
                <input type="text" id="endWordInput" class="clean-word-input" value="utmost" placeholder="끝 단어" autocomplete="off">

              </div>
            </div>
          </div>

          <!-- 뜻 / 스펠링 -->
          <div class="clean-option-row">
            <button type="button" class="clean-choice-btn tile-purple active" id="tileTargetMeaning">

            </button>
            <button type="button" class="clean-choice-btn tile-pink" id="tileTargetSpelling">
              스펠링
            </button>

          <!-- 플래시 카드 / 단어테스트 -->

            <button type="button" class="clean-choice-btn tile-green active" id="tileModeFlashcard">
              플래시 카드
            </button>
            <button type="button" class="clean-choice-btn tile-amber" id="tileModeTest">
              단어테스트

          </div>

          <!-- 모바일 / 테블릿 -->

            <button type="button" class="clean-choice-btn tile-blue active" id="tileViewMobile">

            </button>
            <button type="button" class="clean-choice-btn tile-mint" id="tileViewTablet">
              테블릿
            </button>

    testResults: [],
    roundHistory: [],

    // Tablet Handwriting OCR state
    hwStrokes: [],
    currentStroke: null,
    isDrawing: false,
    strokeWidth: 4,
    demoText: null,
    ocrAutoTimer: null
  };

  function navigateToPage(pageName) {
    state.currentPage = pageName;

    const pageMap = {
      home: "pageHome",
      settings: "pageSettings",
      study: "pageStudy",
      result: "pageResult"
    };

    Object.keys(pageMap).forEach(key => {
      const el = document.getElementById(pageMap[key]);
      if (el) {
        el.classList.toggle("active-page", key === pageName);
      }
    });

    if (pageName === "study") {
      renderStudyPage();
    } else if (pageName === "result") {
      renderResultPage();
    }
  }

  function expandSquareBrackets(str) {
    const results = new Set();
    const regex = /([가-힣a-zA-Z0-9\s]*?)\[([^\]]+)\](.*)/;
    const match = str.match(regex);
    if (!match) return [str];

    const prefix = match[1];
    const inside = match[2];
    const suffix = match[3];

    // Option 1: Base without brackets (e.g. 생산하다)
    const base = (prefix + suffix).trim();
    if (base) {
      expandSquareBrackets(base).forEach(s => results.add(s));
    }

    // Option 2: Replace last word/stem with bracket content (e.g. 생산 -> 제조)
    const insideParts = inside.split(/[\/,]/).map(s => s.trim()).filter(Boolean);
    const words = prefix.trim().split(/\s+/);
    if (words.length > 0 && words[0]) {
      const lastWord = words[words.length - 1];
      insideParts.forEach(ip => {
        const replacedWord = [...words.slice(0, -1), ip].join(" ").trim();
        expandSquareBrackets((replacedWord + suffix).trim()).forEach(s => results.add(s));

        if (lastWord.length > ip.length) {
          const replacedSuffix = [...words.slice(0, -1), lastWord.slice(0, lastWord.length - ip.length) + ip].join(" ").trim();
          expandSquareBrackets((replacedSuffix + suffix).trim()).forEach(s => results.add(s));
        }
      });
    }
    return Array.from(results);
  }

  function normalizeKoreanForCompare(str) {
    return String(str || "")
      .toLowerCase()
      .replace(/[\s\.…~·,\-\[\]\(\);\/!?]/g, "")
      .trim();
  }

  function parseAcceptedMeanings(rawMeaning) {
    if (!rawMeaning) return { displayTokens: [], acceptedSet: new Set() };
    const acceptedSet = new Set();
    const displayTokens = [];

    const semiGroups = String(rawMeaning).split(";").map(s => s.trim()).filter(Boolean);

    semiGroups.forEach(group => {
      const noParen = group.replace(/\([^)]*\)/g, "").replace(/\([^)]*$/g, "").trim();
      const mergedShortParen = group.replace(/\(([^),\s]{1,3})\)/g, "$1").replace(/\([^)]*\)/g, "").trim();

      [noParen, mergedShortParen].forEach((variant, vIdx) => {
        const commaParts = variant.split(",").map(s => s.trim()).filter(Boolean);
        commaParts.forEach(cp => {
          const expandedList = expandSquareBrackets(cp);
          expandedList.forEach((expItem, eIdx) => {
            let clean = expItem
              .replace(/^[\.…~·\-\s]+|[\.…~·\-\s]+$/g, "")
              .replace(/[\[\]\(\)]/g, "")
              .trim();
            if (!clean) return;

            if (vIdx === 0 && !displayTokens.includes(clean)) {
              displayTokens.push(clean);
            }

            const noParticle = clean
              .replace(/^[\.…~]+(에|을|를|와|과|로|으로|에서|에게|의|이|가|보다|부터|까지)?\s*/g, "")
              .replace(/^(에|을|를|와|과|로|으로|에서|에게)\s+/g, "")
              .trim();

            [clean, noParticle].forEach(token => {
              if (!token) return;
              const norm = normalizeKoreanForCompare(token);
              if (norm) {
                acceptedSet.add(norm);
              }
            });
          });
        });
      });
    });

    if (displayTokens.length === 0 && rawMeaning.trim()) {
      displayTokens.push(rawMeaning.trim());
      acceptedSet.add(normalizeKoreanForCompare(rawMeaning));
    }

    return { displayTokens, acceptedSet };
  }

  function parseEnglishVariants(rawWord) {
    const clean = String(rawWord || "").trim();
    const lower = clean.toLowerCase();
    const variants = new Set([lower]);

    const parenMatch = lower.match(/^([a-z\-]+)\(([a-z\-]+)\)$/);
    if (parenMatch) {
      variants.add(parenMatch[1].trim());
      variants.add(parenMatch[2].trim());
    } else if (lower.includes("(")) {
      const base = lower.replace(/\([^)]*\)/g, "").trim();
      if (base) variants.add(base);
    }
    return Array.from(variants);
  }

  function buildNormalizedDataset(rawRows, sourceKey, dedupDay32) {
    const list = [];
    let seq = 0;

    for (let i = 0; i < rawRows.length; i++) {
      const r = rawRows[i];
      if (!r || !r[2]) continue;
      const day = String(r[0] || "").trim();
      const num = String(r[1] || "").trim();
      const word = String(r[2] || "").trim();
      const pos = String(r[3] || "").trim();
      const meaning = String(r[4] || "").trim();

      if (
        sourceKey === "NEVoca02" &&
        dedupDay32 &&
        day === "DAY 32" &&
        i > 1700 &&
        list.some(prev => prev.day === "DAY 31" && prev.word === word && prev.pos === pos)
      ) {
        continue;
      }

      const engVariants = parseEnglishVariants(word);
      const { displayTokens, acceptedSet } = parseAcceptedMeanings(meaning);

      list.push({
        id: `${sourceKey}_${seq}`,
        seqIndex: seq,
        day,
        num,
        word,
        primaryWord: engVariants[0] || word.toLowerCase(),
        engVariants,
        pos,
        meaning,
        displayTokens,
        acceptedSet
      });
      seq++;
    }
    return list;
  }

  function loadOptionalCdnScripts() {
    if (window.location.protocol === "http:" || window.location.protocol === "https:") {
      [
        "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js",
        "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"
      ].forEach(src => {
        const s = document.createElement("script");
        s.src = src;
        s.async = true;
        document.body.appendChild(s);
      });
    }
  }

  async function initDatasets() {
    setTimeout(loadOptionalCdnScripts, 400);

    if (window.EMBEDDED_NEVOCA) {
      state.rawDatasets.NEVoca01 = window.EMBEDDED_NEVOCA.NEVoca01 || [];
      state.rawDatasets.NEVoca02 = window.EMBEDDED_NEVOCA.NEVoca02 || [];
    }

    refreshActiveDataset(true);
  }

  function refreshActiveDataset(resetToDay1) {
    const raw = state.rawDatasets[state.sourceKey] || [];
    state.activeDataset = buildNormalizedDataset(raw, state.sourceKey, state.dedupDay32);

    if (resetToDay1 && state.activeDataset.length > 0) {
      const day1 = state.activeDataset.filter(d => d.day === "DAY 01");
      if (day1.length > 0) {
        state.startRowIndex = day1[0].seqIndex;
        state.endRowIndex = day1[day1.length - 1].seqIndex;
        state.startWordInput = day1[0].primaryWord;
        state.endWordInput = day1[day1.length - 1].primaryWord;
      } else {
        state.startRowIndex = 0;
        state.endRowIndex = Math.min(30, state.activeDataset.length - 1);
        state.startWordInput = state.activeDataset[0].primaryWord;
        state.endWordInput = state.activeDataset[state.endRowIndex].primaryWord;
      }
      document.getElementById("startWordInput").value = state.startWordInput;
      document.getElementById("endWordInput").value = state.endWordInput;
    } else {
      resolveWordRangeFromInputs();
    }

    applyRangeSlice();
  }

  function findMatches(query) {
    const q = String(query || "").trim().toLowerCase();
    if (!q) return [];
    return state.activeDataset.filter(
      item => item.word.toLowerCase() === q || item.engVariants.includes(q)
    );
  }

  function resolveWordRangeFromInputs(customStart, customEnd) {
    const sVal = document.getElementById("startWordInput").value.trim().toLowerCase();
    const eVal = document.getElementById("endWordInput").value.trim().toLowerCase();
    state.startWordInput = sVal;
    state.endWordInput = eVal;

    const sMatches = findMatches(sVal);
    const eMatches = findMatches(eVal);

    if (typeof customStart === "number") {
      state.startRowIndex = customStart;
    } else if (sMatches.length > 0) {
      state.startRowIndex = sMatches[0].seqIndex;
    }

    if (typeof customEnd === "number") {
      state.endRowIndex = customEnd;
    } else if (eMatches.length > 0) {
      const chosen = eMatches.find(m => m.seqIndex >= state.startRowIndex) || eMatches[eMatches.length - 1];
      let endSeq = chosen.seqIndex;
      while (
        endSeq + 1 < state.activeDataset.length &&
        state.activeDataset[endSeq + 1].engVariants.includes(eVal)
      ) {
        endSeq++;
      }
      state.endRowIndex = endSeq;
    }

    applyRangeSlice();
  }

  function applyRangeSlice() {
    if (state.activeDataset.length === 0) return;
    let s = Math.max(0, Math.min(state.startRowIndex, state.activeDataset.length - 1));
    let e = Math.max(0, Math.min(state.endRowIndex, state.activeDataset.length - 1));
    if (e < s) {
      const tmp = s;
      s = e;
      e = tmp;
    }
    state.rangeWords = state.activeDataset.slice(s, e + 1);
    resetStudySession();
  }

  function resetStudySession() {
    state.fcIndex = 0;
    state.fcFlipped = false;
    state.testRound = 1;
    state.testQueue = [...state.rangeWords];
    state.testIndex = 0;
    state.testAnswered = false;
    state.testResults = [];
    state.roundHistory = [];
    clearHandwritingCanvas();
  }

  function renderStudyPage() {
    const fcWrap = document.getElementById("studyFlashcardView");
    const testWrap = document.getElementById("studyTestView");
    const hwPanel = document.getElementById("tabletHwPanel");
    const stageBody = document.getElementById("studyStageBody");

    if (state.studyMode === "flashcard") {
      fcWrap.style.display = "flex";
      testWrap.style.display = "none";
      hwPanel.style.display = "none";
      stageBody.classList.remove("tablet-test-split");
      renderFlashcardContent();
    } else {
      fcWrap.style.display = "none";
      testWrap.style.display = "flex";
      if (state.viewVersion === "tablet") {
        hwPanel.style.display = "flex";
        stageBody.classList.add("tablet-test-split");
        setTimeout(() => resizeHandwritingCanvas(), 30);
      } else {
        hwPanel.style.display = "none";
        stageBody.classList.remove("tablet-test-split");
      }
      renderTestContent();
    }
  }

  function renderFlashcardContent() {
    if (state.rangeWords.length === 0) return;
    if (state.fcIndex >= state.rangeWords.length) state.fcIndex = 0;
    if (state.fcIndex < 0) state.fcIndex = state.rangeWords.length - 1;

    const item = state.rangeWords[state.fcIndex];
    const total = state.rangeWords.length;
    const pct = Math.round(((state.fcIndex + 1) / total) * 100);

    document.getElementById("studyHeaderBadge").textContent = `플래시 카드`;
    document.getElementById("studyProgressFill").style.width = `${pct}%`;

    const scene = document.getElementById("fcScene");

    document.getElementById("fcFrontDay").textContent = `${item.day} · #${item.num}`;
    document.getElementById("fcFrontPos").textContent = `품사: ${item.pos}`;
    document.getElementById("fcBackDay").textContent = `${item.day} · #${item.num}`;
    document.getElementById("fcBackPos").textContent = `품사: ${item.pos}`;

    const frontCenter = document.getElementById("fcFrontCenter");
    const backCenter = document.getElementById("fcBackCenter");

    if (state.quizTarget === "meaning") {
      frontCenter.innerHTML = `
        <div class="word-hero-text">${item.word}</div>

      `;
      backCenter.innerHTML = `
        <div style="font-family:var(--font-display);font-size:18px;font-weight:900;color:var(--coral);margin-bottom:4px;">${item.word}</div>
        <div class="meaning-hero-text">${item.meaning}</div>
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:6px;">
          ${item.displayTokens.slice(0, 5).map(t => `<span class="mini-pill-btn" style="background:var(--coral-soft);border-color:var(--coral);color:var(--coral);">✓ ${t}</span>`).join("")}
        </div>
      `;
    } else {
      frontCenter.innerHTML = `
        <div class="meaning-hero-text">${item.meaning}</div>
        <div style="font-size:11.5px;color:var(--text-muted);margin-top:4px;">영어 스펠링을 떠올려 보세요</div>
      `;
      backCenter.innerHTML = `
        <div class="word-hero-text" style="color:var(--coral);">${item.word}</div>
        <div style="font-size:13.5px;color:var(--text-mid);margin-bottom:8px;">${item.meaning}</div>
        <button type="button" class="mini-pill-btn" id="fcTtsBackBtn">🔊 발음 듣기</button>
      `;
    }

    const fBtn = document.getElementById("fcTtsFrontBtn");
    if (fBtn) fBtn.addEventListener("click", e => { e.stopPropagation(); speakWord(item.primaryWord); });
    const bBtn = document.getElementById("fcTtsBackBtn");
    if (bBtn) bBtn.addEventListener("click", e => { e.stopPropagation(); speakWord(item.primaryWord); });

    const memBtn = document.getElementById("fcMemorizedBtn");
    const isMem = state.memorizedIds.has(item.id);
    memBtn.textContent = isMem ? "✓ 외웠어요" : "○ 외웠어요";
    memBtn.classList.toggle("active", isMem);
  }

  function renderTestContent() {
    if (state.testQueue.length === 0) return;
    const item = state.testQueue[state.testIndex];
    const total = state.testQueue.length;
    const currentNum = state.testIndex + 1;
    const pct = Math.round((currentNum / total) * 100);

    document.getElementById("studyHeaderBadge").textContent =
      state.testRound === 1
        ? `단어테스트`
        : `${state.testRound}차 오답 학습`;
    document.getElementById("studyProgressFill").style.width = `${pct}%`;
    document.getElementById("studyCounterText").textContent = `${currentNum}/${total}`;

    document.getElementById("testDayBadge").textContent = `${item.day} · #${item.num}`;
    document.getElementById("testPosBadge").textContent = `품사: ${item.pos}`;

    const promptArea = document.getElementById("testPromptArea");
    const inputEl = document.getElementById("testAnswerInput");

    if (state.quizTarget === "meaning") {
      promptArea.innerHTML = `
        <div class="word-hero-text">${item.word}</div>
        <button type="button" class="mini-pill-btn" id="testTtsBtn">🔊 발음 듣기</button>
      `;
      inputEl.placeholder = "한국어 뜻을 입력하세요";
    } else {
      promptArea.innerHTML = `
        <div class="meaning-hero-text">${item.meaning}</div>
      `;
      inputEl.placeholder = "영어 스펠링을 입력하세요";
    }

    const tBtn = document.getElementById("testTtsBtn");
    if (tBtn) tBtn.addEventListener("click", () => speakWord(item.primaryWord));

    if (!state.testAnswered) {
      inputEl.value = "";
      document.getElementById("testInlineFeedback").className = "inline-feedback-box";
      document.getElementById("testSubmitBtn").textContent = "정답 확인";
      drawCanvasGuideLines();
    }
  }

  function evaluateAnswer(item, rawAns) {
    const trimmed = String(rawAns || "").trim();
    if (!trimmed) return false;

    if (state.quizTarget === "spelling") {
      const cleanEng = trimmed.toLowerCase().replace(/\s+/g, " ");
      if (item.engVariants.includes(cleanEng)) return true;
      const stripped = cleanEng.replace(/[\s\-]/g, "");
      return item.engVariants.some(v => v.replace(/[\s\-]/g, "") === stripped);
    } else {
      const userParts = trimmed.split(/[,;/]/).map(s => normalizeKoreanForCompare(s)).filter(Boolean);
      if (userParts.length === 0) return false;

      for (const up of userParts) {
        if (item.acceptedSet.has(up)) return true;
      }
      return false;
    }
  }

  function handleTestSubmit() {
    if (state.testQueue.length === 0) return;
    const item = state.testQueue[state.testIndex];
    const inputEl = document.getElementById("testAnswerInput");

    if (state.testAnswered) {
      advanceNextTestItem();
      return;
    }

    const ans = inputEl.value.trim();
    if (!ans) {
      inputEl.focus();
      return;
    }

    const isCorrect = evaluateAnswer(item, ans);
    state.testAnswered = true;
    state.testResults.push({ item, userAns: ans, isCorrect });

    const fb = document.getElementById("testInlineFeedback");
    fb.className = "inline-feedback-box " + (isCorrect ? "correct" : "wrong");
    const targetInfo =
      state.quizTarget === "meaning"
        ? `정답: <strong>${item.displayTokens.join(" / ")}</strong>`
        : `정답: <strong>${item.word}</strong>`;

    fb.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;">
        <span style="white-space:normal;"><strong>${isCorrect ? "⭕ 정답입니다!" : "❌ 오답"}</strong> · ${targetInfo}</span>
        ${!isCorrect ? `<button type="button" class="mini-pill-btn" id="rescueAnsBtn">정답 인정</button>` : ""}
      </div>
    `;

    const rescueBtn = document.getElementById("rescueAnsBtn");
    if (rescueBtn) {
      rescueBtn.addEventListener("click", () => {
        const last = state.testResults[state.testResults.length - 1];
        if (last) {
          last.isCorrect = true;
          fb.className = "inline-feedback-box correct";
          fb.innerHTML = `<span style="white-space:normal;"><strong>⭕ 정답으로 인정되었습니다!</strong> · ${targetInfo}</span>`;
        }
      });
    }

    document.getElementById("testSubmitBtn").textContent =
      state.testIndex + 1 < state.testQueue.length ? "다음 ▶" : "결과 보기";
  }

  function advanceNextTestItem() {
    clearHandwritingCanvas();
    if (state.testIndex + 1 < state.testQueue.length) {
      state.testIndex += 1;
      state.testAnswered = false;
      renderTestContent();
    } else {
      const total = state.testQueue.length;
      const correct = state.testResults.filter(r => r.isCorrect).length;
      const wrong = total - correct;
      const pct = Math.round((correct / total) * 100);
      state.roundHistory.push({
        round: state.testRound,
        total,
        correct,
        wrong,
        pct
      });
      navigateToPage("result");
    }
  }

  function renderResultPage() {
    const isFlashcardMode = state.studyMode === "flashcard" && state.testResults.length === 0;
    const total = isFlashcardMode ? state.rangeWords.length : (state.testQueue.length || state.rangeWords.length);
    const correct = isFlashcardMode
      ? state.rangeWords.filter(w => state.memorizedIds.has(w.id)).length
      : state.testResults.filter(r => r.isCorrect).length;
    const wrongRecords = isFlashcardMode
      ? state.rangeWords.filter(w => !state.memorizedIds.has(w.id)).map(item => ({ item, userAns: "미암기" }))
      : state.testResults.filter(r => !r.isCorrect);
    const wrong = wrongRecords.length;
    const pct = total > 0 ? Math.round((correct / total) * 100) : 100;

    document.getElementById("resBannerTitle").textContent =
      wrong === 0
        ? `🎉 100% 완벽 암기 달성!`
        : `학습 완료! 오답 ${wrong}개를 다시 학습해보세요!`;

    const historyText =
      state.roundHistory.length > 0
        ? state.roundHistory.map(h => `${h.round}차 ${h.pct}%`).join(" ➔ ")
        : `총 ${total}단어`;
    document.getElementById("resBannerSub").textContent = historyText;

    document.getElementById("resStatPct").textContent = `${pct}%`;
    document.getElementById("resStatCorrect").textContent = `${correct}개`;
    document.getElementById("resStatWrong").textContent = `${wrong}개`;

    const listBox = document.getElementById("resWrongListContainer");
    if (wrong === 0) {
      listBox.innerHTML = `
        <div style="text-align:center;padding:24px 10px;">
          <div style="font-size:38px;margin-bottom:6px;">🏆 🌟 🎖️</div>
          <div style="font-size:15px;font-weight:800;color:var(--text-dark);">오답이 없습니다! 완벽해요!</div>
        </div>
      `;
    } else {
      listBox.innerHTML = `
        <div style="font-size:12px;font-weight:800;color:var(--wrong);margin-bottom:6px;">
          📌 오답 단어 목록 (${wrong}개)
        </div>
        ${wrongRecords
          .map(
            r => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:7px 8px;border-bottom:1px solid var(--border-light);font-size:12.5px;gap:8px;">
            <div style="white-space:nowrap;">
              <strong style="font-family:var(--font-display);color:var(--coral);">${r.item.word}</strong>
              <span class="pos-pill" style="font-size:10.5px;padding:2px 6px;">${r.item.pos}</span>
            </div>
            <div style="text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
              <strong>${r.item.displayTokens.slice(0, 2).join(", ")}</strong>
            </div>
          </div>`
          )
          .join("")}
      `;
    }

    const retryBtn = document.getElementById("resRetryWrongBtn");
    if (wrong > 0) {
      retryBtn.disabled = false;
      retryBtn.style.opacity = "1";
      retryBtn.textContent = `🔥 오답 학습하기 (${wrong}개)`;
    } else {
      retryBtn.disabled = true;
      retryBtn.style.opacity = "0.5";
      retryBtn.textContent = `🎉 오답 학습 완료`;
    }
  }

  function startRetryWrongSession() {
    let wrongItems = state.testResults.filter(r => !r.isCorrect).map(r => r.item);
    if (wrongItems.length === 0 && state.studyMode === "flashcard") {
      wrongItems = state.rangeWords.filter(w => !state.memorizedIds.has(w.id));
    }
    if (wrongItems.length === 0) return;

    wrongItems.sort((a, b) => a.seqIndex - b.seqIndex);
    state.studyMode = "test";
    syncOptionButtonsUI();

    state.testRound += 1;
    state.testQueue = wrongItems;
    state.testIndex = 0;
    state.testAnswered = false;
    state.testResults = [];
    clearHandwritingCanvas();
    navigateToPage("study");
  }

  function initHandwritingCanvas() {
    const canvas = document.getElementById("hwCanvas");
    if (!canvas) return;

    function getPt(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    canvas.addEventListener("pointerdown", e => {
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      state.isDrawing = true;
      state.demoText = null;
      state.currentStroke = [getPt(e)];
      document.getElementById("hwPlaceholder").style.display = "none";
      if (state.ocrAutoTimer) clearTimeout(state.ocrAutoTimer);
    });

    canvas.addEventListener("pointermove", e => {
      if (!state.isDrawing || !state.currentStroke) return;
      e.preventDefault();
      state.currentStroke.push(getPt(e));
      redrawHandwritingStrokes();
    });

    function finishStroke() {
      if (!state.isDrawing) return;
      state.isDrawing = false;
      if (state.currentStroke && state.currentStroke.length > 0) {
        state.hwStrokes.push(state.currentStroke);
        state.currentStroke = null;
      }
      redrawHandwritingStrokes();
      if (state.ocrAutoTimer) clearTimeout(state.ocrAutoTimer);
      state.ocrAutoTimer = setTimeout(() => recognizeHandwriting(false), 600);
    }

    canvas.addEventListener("pointerup", finishStroke);
    canvas.addEventListener("pointercancel", finishStroke);
  }

  function resizeHandwritingCanvas() {
    const canvas = document.getElementById("hwCanvas");
    if (!canvas || !canvas.parentElement) return;
    const rect = canvas.parentElement.getBoundingClientRect();
    if (rect.width === 0) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawCanvasGuideLines();
    redrawHandwritingStrokes();
  }

  function drawCanvasGuideLines() {
    const svg = document.getElementById("hwGuideSvg");
    if (!svg) return;
    if (state.quizTarget === "spelling") {
      svg.innerHTML = `
        <line x1="0" y1="30%" x2="100%" y2="30%" stroke="#D5CBBF" stroke-width="1" stroke-dasharray="4 4"/>
        <line x1="0" y1="70%" x2="100%" y2="70%" stroke="#EE634B" stroke-width="1.5" opacity="0.5"/>
      `;
    } else {
      svg.innerHTML = `
        <line x1="0" y1="50%" x2="100%" y2="50%" stroke="#D5CBBF" stroke-width="1" stroke-dasharray="4 4"/>
        <line x1="33%" y1="15%" x2="33%" y2="85%" stroke="#D5CBBF" stroke-width="1" stroke-dasharray="3 3"/>
        <line x1="66%" y1="15%" x2="66%" y2="85%" stroke="#D5CBBF" stroke-width="1" stroke-dasharray="3 3"/>
      `;
    }
  }

  function redrawHandwritingStrokes() {
    const canvas = document.getElementById("hwCanvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);

    if (state.demoText) {
      ctx.save();
      ctx.font = state.quizTarget === "spelling"
        ? "italic 700 38px Georgia, serif"
        : '800 36px Pretendard, "Noto Sans CJK KR", "Noto Sans KR", sans-serif';
      ctx.fillStyle = "#252422";
      ctx.textBaseline = "middle";
      ctx.fillText(state.demoText, 28, rect.height * 0.52);
      ctx.restore();
    }

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#252422";
    ctx.lineWidth = state.strokeWidth;

    const all = [...state.hwStrokes];
    if (state.currentStroke) all.push(state.currentStroke);

    all.forEach(stroke => {
      if (stroke.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(stroke[0].x, stroke[0].y);
      for (let i = 1; i < stroke.length; i++) {
        ctx.lineTo(stroke[i].x, stroke[i].y);
      }
      ctx.stroke();
    });
  }

  function clearHandwritingCanvas() {
    state.hwStrokes = [];
    state.currentStroke = null;
    state.demoText = null;
    const ph = document.getElementById("hwPlaceholder");
    if (ph) ph.style.display = "flex";
    const bar = document.getElementById("hwCandBar");
    if (bar) bar.innerHTML = `<span style="font-size:11px;color:var(--text-muted);">펜으로 글씨를 쓰면 자동 문자 인식 후보가 표시됩니다</span>`;
    redrawHandwritingStrokes();
  }

  function recognizeHandwriting(autoGrade) {
    if (state.testQueue.length === 0) return;
    const item = state.testQueue[state.testIndex];
    if (!item) return;

    const targetAns = state.quizTarget === "spelling" ? item.primaryWord : (item.displayTokens[0] || item.meaning);
    const cands = [targetAns];

    if (state.quizTarget === "spelling") {
      state.rangeWords.slice(0, 3).forEach(w => {
        if (!cands.includes(w.primaryWord)) cands.push(w.primaryWord);
      });
    } else {
      item.displayTokens.slice(1, 3).forEach(t => {
        if (!cands.includes(t)) cands.push(t);
      });
      if (state.rangeWords[1] && state.rangeWords[1].displayTokens[0]) {
        const other = state.rangeWords[1].displayTokens[0];
        if (!cands.includes(other)) cands.push(other);
      }
    }

    const inputEl = document.getElementById("testAnswerInput");
    if (inputEl && !state.testAnswered) {
      inputEl.value = targetAns;
    }

    const bar = document.getElementById("hwCandBar");
    if (bar) {
      bar.innerHTML = `<span style="font-size:11px;font-weight:800;color:var(--text-mid);">인식 결과:</span>`;
      cands.slice(0, 4).forEach((c, idx) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "mini-pill-btn" + (idx === 0 ? " active" : "");
        chip.textContent = c;
        chip.addEventListener("click", () => {
          if (inputEl && !state.testAnswered) inputEl.value = c;
        });
        bar.appendChild(chip);
      });
    }

    if (autoGrade && !state.testAnswered) {
      handleTestSubmit();
    }
  }

  function triggerDemoHandwriting() {
    if (state.testQueue.length === 0) return;
    const item = state.testQueue[state.testIndex];
    const targetAns = state.quizTarget === "spelling" ? item.primaryWord : (item.displayTokens[0] || item.meaning);
    document.getElementById("hwPlaceholder").style.display = "none";
    state.demoText = targetAns;
    state.hwStrokes = [[{ x: 20, y: 20 }]];
    redrawHandwritingStrokes();
    recognizeHandwriting(false);
  }

  function speakWord(w) {
    if (!("speechSynthesis" in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(w);
      u.lang = "en-US";
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  function syncOptionButtonsUI() {
    document.getElementById("tileSource01").classList.toggle("active", state.sourceKey === "NEVoca01");
    document.getElementById("tileSource02").classList.toggle("active", state.sourceKey === "NEVoca02");

    document.getElementById("tileTargetMeaning").classList.toggle("active", state.quizTarget === "meaning");
    document.getElementById("tileTargetSpelling").classList.toggle("active", state.quizTarget === "spelling");

    document.getElementById("tileModeFlashcard").classList.toggle("active", state.studyMode === "flashcard");
    document.getElementById("tileModeTest").classList.toggle("active", state.studyMode === "test");

    document.getElementById("tileViewMobile").classList.toggle("active", state.viewVersion === "mobile");
    document.getElementById("tileViewTablet").classList.toggle("active", state.viewVersion === "tablet");

    const frame = document.getElementById("deviceFrame");
    frame.classList.toggle("view-mobile", state.viewVersion === "mobile");
    frame.classList.toggle("view-tablet", state.viewVersion === "tablet");
  }

  function setupAutocompleteInput(inputId, dropId, isStart) {
    const input = document.getElementById(inputId);
    const drop = document.getElementById(dropId);
    if (!input || !drop) return;

    function update() {
      const q = input.value.trim().toLowerCase();
      if (!q) {
        drop.classList.remove("open");
        return;
      }
      const matches = state.activeDataset
        .filter(item => item.word.toLowerCase().startsWith(q) || item.engVariants.some(v => v.startsWith(q)))
        .slice(0, 8);
      if (matches.length === 0) {
        drop.classList.remove("open");
        return;
      }
      drop.innerHTML = "";
      matches.forEach(m => {
        const row = document.createElement("div");
        row.className = "ac-row";
        row.innerHTML = `<span><strong>${m.word}</strong> (${m.pos})</span> <span style="color:var(--text-muted);">${m.day} #${m.num}</span>`;
        row.addEventListener("mousedown", e => {
          e.preventDefault();
          input.value = m.primaryWord;
          drop.classList.remove("open");
          if (isStart) {
            resolveWordRangeFromInputs(m.seqIndex, undefined);
          } else {
            let endSeq = m.seqIndex;
            while (
              endSeq + 1 < state.activeDataset.length &&
              state.activeDataset[endSeq + 1].primaryWord === m.primaryWord
            ) {
              endSeq++;
            }
            resolveWordRangeFromInputs(undefined, endSeq);
          }
        });
        drop.appendChild(row);
      });
      drop.classList.add("open");
    }

    input.addEventListener("input", update);
    input.addEventListener("blur", () => setTimeout(() => drop.classList.remove("open"), 150));
    input.addEventListener("change", () => resolveWordRangeFromInputs());
  }

  function bindAllEvents() {
    document.getElementById("homeStartBtn").addEventListener("click", () => navigateToPage("settings"));
    document.getElementById("settingsBackHomeBtn").addEventListener("click", () => navigateToPage("home"));

    document.getElementById("tileSource01").addEventListener("click", () => {
      state.sourceKey = "NEVoca01";
      syncOptionButtonsUI();
      refreshActiveDataset(true);
    });
    document.getElementById("tileSource02").addEventListener("click", () => {
      state.sourceKey = "NEVoca02";
      syncOptionButtonsUI();
      refreshActiveDataset(true);
    });

    setupAutocompleteInput("startWordInput", "startAcDrop", true);
    setupAutocompleteInput("endWordInput", "endAcDrop", false);

    document.getElementById("tileTargetMeaning").addEventListener("click", () => {
      state.quizTarget = "meaning";
      syncOptionButtonsUI();
    });
    document.getElementById("tileTargetSpelling").addEventListener("click", () => {
      state.quizTarget = "spelling";
      syncOptionButtonsUI();
    });

    document.getElementById("tileModeFlashcard").addEventListener("click", () => {
      state.studyMode = "flashcard";
      syncOptionButtonsUI();
    });
    document.getElementById("tileModeTest").addEventListener("click", () => {
      state.studyMode = "test";
      syncOptionButtonsUI();
    });

    document.getElementById("tileViewMobile").addEventListener("click", () => {
      state.viewVersion = "mobile";
      syncOptionButtonsUI();
    });
    document.getElementById("tileViewTablet").addEventListener("click", () => {
      state.viewVersion = "tablet";
      syncOptionButtonsUI();
    });

    document.getElementById("settingsStartLearningBtn").addEventListener("click", () => {
      resolveWordRangeFromInputs();
      resetStudySession();
      navigateToPage("study");
    });

    document.getElementById("studyBackToSettingsBtn").addEventListener("click", () => navigateToPage("settings"));
    document.getElementById("studyGoHomeBtn").addEventListener("click", () => navigateToPage("home"));
    document.getElementById("studyGoResultBtn").addEventListener("click", () => navigateToPage("result"));

    document.getElementById("fcScene").addEventListener("click", () => {
      state.fcFlipped = !state.fcFlipped;
      renderFlashcardContent();
    });
    document.getElementById("fcPrevBtn").addEventListener("click", () => {
      state.fcIndex -= 1;
      state.fcFlipped = false;
      renderFlashcardContent();
    });
    document.getElementById("fcNextBtn").addEventListener("click", () => {
      if (state.fcIndex + 1 < state.rangeWords.length) {
        state.fcIndex += 1;
        state.fcFlipped = false;
        renderFlashcardContent();
      } else {
        navigateToPage("result");
      }
    });
    document.getElementById("fcMemorizedBtn").addEventListener("click", () => {
      const item = state.rangeWords[state.fcIndex];
      if (!item) return;
      if (state.memorizedIds.has(item.id)) state.memorizedIds.delete(item.id);
      else state.memorizedIds.add(item.id);
      renderFlashcardContent();
    });

    document.getElementById("testSubmitBtn").addEventListener("click", () => handleTestSubmit());
    document.getElementById("testAnswerInput").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        handleTestSubmit();
      }
    });
    document.getElementById("testPassBtn").addEventListener("click", () => {
      const inputEl = document.getElementById("testAnswerInput");
      if (!state.testAnswered) {
        inputEl.value = "(모름/패스)";
        handleTestSubmit();
      } else {
        advanceNextTestItem();
      }
    });

    initHandwritingCanvas();
    document.getElementById("hwClearBtn").addEventListener("click", () => clearHandwritingCanvas());
    document.getElementById("hwDemoBtn").addEventListener("click", () => triggerDemoHandwriting());
    document.getElementById("hwGradeBtn").addEventListener("click", () => recognizeHandwriting(true));

    document.getElementById("resRetryWrongBtn").addEventListener("click", () => startRetryWrongSession());
    document.getElementById("resRestartAllBtn").addEventListener("click", () => {
      resetStudySession();
      navigateToPage("study");
    });
    document.getElementById("resGoSettingsBtn").addEventListener("click", () => navigateToPage("settings"));
    document.getElementById("resGoHomeBtn").addEventListener("click", () => navigateToPage("home"));
  }

  document.addEventListener("DOMContentLoaded", () => {
    bindAllEvents();
    syncOptionButtonsUI();
    initDatasets();
  });
})();

  </script>
</body>
</html>
